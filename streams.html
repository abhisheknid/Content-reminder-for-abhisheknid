<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streams — Abhi’s Content System</title>
  <meta name="description" content="A livestreaming playbook for earning new reach, for any brand, with Dopami's ADHD body-doubling streams as the worked example." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/style.css?v=9f97c2a3" />
</head>
<body>
  <div class="wrap wide">
    <script src="assets/nav.js?v=7c2e03ec"></script>

    <p class="eyebrow"><span class="dot"></span> <span id="eyebrow-text">Dopami · Growth</span></p>
    <h1 id="page-title">Streams</h1>
    <p class="sub" id="subtitle">A livestreaming playbook for earning new reach — for any brand.</p>

    <div class="hero-card" style="margin-bottom: 36px;">
      <p class="nudge" id="intro" style="margin: 0;"></p>
    </div>

    <div class="cat-nav" id="cat-nav"></div>

    <div id="categories"></div>

    <div class="info-columns" style="grid-template-columns: 1fr;">
      <div class="info-box">
        <h2>How to start this week</h2>
        <ol class="order-list" id="how-to-run"></ol>
      </div>
    </div>
  </div>

  <script type="module">
    async function init() {
      const res = await fetch("data/streams.json");
      const data = await res.json();

      document.getElementById("eyebrow-text").textContent = data.eyebrow;
      document.getElementById("page-title").textContent = data.title;
      document.getElementById("subtitle").textContent = data.subtitle;
      document.getElementById("intro").textContent = data.intro;

      const catNav = document.getElementById("cat-nav");
      catNav.innerHTML = data.categories
        .map((c) => `<a href="#cat-${c.id}">${c.id}. ${c.title} <span class="count">(${c.ads.length})</span></a>`)
        .join("");

      const root = document.getElementById("categories");
      root.innerHTML = data.categories.map(categoryHtml).join("");

      document.getElementById("how-to-run").innerHTML = data.howToRun
        .map((step, i) => `<li><span class="step-num">${i + 1}</span><span>${step}</span></li>`)
        .join("");
    }

    function categoryHtml(cat) {
      const cards = cat.ads.map(ideaHtml).join("");
      return `
        <section class="shot-category" id="cat-${cat.id}">
          <div class="category-head">
            <h2>${cat.id}. ${cat.title}</h2>
            <span class="category-count">${cat.ads.length} moves</span>
          </div>
          <p class="category-blurb">${cat.blurb}</p>
          <div class="shot-grid" style="grid-template-columns: 1fr;">${cards}</div>
        </section>
      `;
    }

    function ideaHtml(a) {
      return `
        <div class="shot-card">
          <span class="shot-num">${a.num}</span><span class="shot-name">${a.name}</span>
          <p class="shot-frame">${a.frame}</p>
          <p class="shot-why">${a.why}</p>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>

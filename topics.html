<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse All Topics</title>
  <meta name="description" content="230 recurring writing prompts organized into 12 pillars." />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap wide">
    <div class="nav">
      <a class="brand" href="index.html"><span aria-hidden="true">✍️</span> Daily Prompt</a>
      <div class="nav-links">
        <span class="dot" aria-hidden="true"></span>
        <a href="index.html">Today's prompt</a>
      </div>
    </div>

    <p class="eyebrow"><span class="dot"></span> 230 prompts · 12 pillars</p>
    <h1>Browse every<br />topic</h1>
    <p class="sub">
      Don't make your content primarily about what you do — make it about how you think.
      Search, or scan by pillar, and jump into whichever one's alive for you today.
    </p>

    <div class="toolbar" id="search">
      <input class="search" id="search-input" type="search" placeholder="Search topics… (e.g. failure, AI, hiring)" />
      <a class="today-pill" id="today-jump" href="#">Jump to today's pick →</a>
    </div>

    <div id="categories"></div>
    <p class="empty-state hidden" id="empty-state">No topics match that search.</p>
  </div>

  <script type="module">
    import { dailyIndex } from "./assets/rotation.js";

    let data, todayId;

    async function init() {
      const res = await fetch("data/topics.json");
      data = await res.json();
      const allItems = data.categories.flatMap((c) => c.items);
      todayId = allItems[dailyIndex(data.total)].id;

      render(data.categories);

      document.getElementById("search-input").addEventListener("input", (e) => {
        filter(e.target.value.trim().toLowerCase());
      });

      document.getElementById("today-jump").addEventListener("click", (e) => {
        e.preventDefault();
        const el = document.querySelector(`[data-id="${todayId}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function render(categories) {
      const root = document.getElementById("categories");
      root.innerHTML = categories.map(categoryHtml).join("");
    }

    function categoryHtml(cat) {
      const cards = cat.items.map(itemHtml).join("");
      return `
        <section class="category" data-cat="${cat.slug}">
          <div class="category-head">
            <h2>${cat.id}. ${cat.name}</h2>
            <span class="category-count">${cat.items.length} prompts</span>
          </div>
          <p class="category-blurb">${cat.blurb}</p>
          <div class="grid">${cards}</div>
        </section>
      `;
    }

    function itemHtml(item) {
      const isToday = item.id === todayId;
      return `
        <div class="card ${isToday ? "is-today" : ""}" data-id="${item.id}" data-search="${item.title.toLowerCase()}">
          ${isToday ? `<span class="today-badge">Today</span>` : ""}
          <span class="num">#${item.id}</span>${item.title}
        </div>
      `;
    }

    function filter(query) {
      const cards = document.querySelectorAll(".card");
      let anyVisible = false;
      const catVisibility = {};

      cards.forEach((card) => {
        const match = !query || card.dataset.search.includes(query);
        card.classList.toggle("hidden", !match);
        if (match) {
          anyVisible = true;
          const section = card.closest(".category");
          catVisibility[section.dataset.cat] = true;
        }
      });

      document.querySelectorAll(".category").forEach((section) => {
        section.classList.toggle("hidden", !catVisibility[section.dataset.cat]);
      });

      document.getElementById("empty-state").classList.toggle("hidden", anyVisible || !query);
    }

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhi’s Content System</title>
  <meta name="description" content="Daily writing prompts, B-roll shots, reel ideas, ads, streams and LinkedIn posts for building Dopami." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/style.css?v=9f97c2a3" />
</head>
<body>
  <div class="wrap wide">
    <script src="assets/nav.js?v=7c2e03ec"></script>

    <p class="eyebrow"><span class="dot"></span> <span id="today-date">Loading…</span></p>
    <h1>Don’t think.<br />Just Post</h1>
    <p class="sub">Use one idea everyday and apply.</p>

    <div class="page-grid" id="page-grid"></div>
    <script>
      document.getElementById("page-grid").innerHTML = window.SITE_PAGES.map(function (p) {
        return '<a class="page-card" href="' + p.href + '" style="--tint:' + p.tint + ';--deep:' + p.color + '">' +
          '<span class="count">' + p.count + '</span>' + p.icon +
          '<h3>' + p.name + '</h3><p>' + p.desc + '</p>' +
          '<span class="go">Open <span aria-hidden="true">→</span></span>' +
          '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 L10.5 8 L6 12.5"/></svg></a>';
      }).join("");
    </script>

    <p class="section-label"><span class="dot"></span> Today's writing prompt</p>
    <div class="hero-card">
      <span class="pillar-tag"><span class="dot"></span> <span id="pillar-tag">—</span></span>
      <h2 class="hero-title" id="prompt-title">Loading today's prompt…</h2>
      <p class="nudge" id="nudge-text"></p>

      <div class="features" id="starter-list"></div>

      <div class="cta-row">
        <div class="btn-wrap">
          <a class="btn btn-primary" id="write-link" href="#">Start writing this →</a>
        </div>
        <a class="btn btn-secondary" href="topics.html">See it in its category</a>
      </div>
    </div>

  </div>

  <script type="module">
    import { dailyIndex, todayLabel } from "./assets/rotation.js";
    import { pickNudge, starterQuestions } from "./assets/copy.js";

    async function init() {
      const res = await fetch("data/topics.json");
      const data = await res.json();
      const items = data.categories.flatMap((c) => c.items.map((it) => ({ ...it, categoryName: c.name, categorySlug: c.slug })));

      const idx = dailyIndex(data.total);
      const today = items[idx];

      document.getElementById("today-date").textContent = todayLabel();
      document.getElementById("pillar-tag").textContent = today.categoryName;
      document.getElementById("prompt-title").textContent = `"${today.title}"`;
      document.getElementById("nudge-text").textContent = pickNudge(today.title);
      document.getElementById("write-link").href = `https://docs.google.com/document/create`;

      const starters = starterQuestions();
      const list = document.getElementById("starter-list");
      list.innerHTML = starters
        .map((s) => {
          const [label, rest] = s.split(/:\s(.+)/);
          return `<div class="feature"><h3>${label}</h3><p>${rest}</p></div>`;
        })
        .join("");
    }

    init();
  </script>
</body>
</html>
